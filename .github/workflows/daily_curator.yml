name: Curador Científico Diário LaBiOmicS

on:
  schedule:
    # Roda diariamente às 10:00 UTC (07:00 no horário de Brasília)
    - cron: '0 10 * * *'
  workflow_dispatch: # Permite disparo manual com 1 clique pela aba Actions do GitHub

permissions:
  contents: write

jobs:
  curate-papers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Executar Curador e Redator IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-2.5-flash"
        run: |
          python scripts/curator.py --limit 10 --days 60

      - name: Commit e Push do Novo Artigo
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts/ data/history.json
          if git diff --staged --quiet; then
            echo "Nenhum novo artigo gerado nesta rodada."
          else
            git commit -m "chore(auto): publicação de novos artigos de bioinformática"
            git push
          fi
